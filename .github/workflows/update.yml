name: Update Shadowrocket Config

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update.yml"
      - "scripts/generate.py"
      - "roscomvpn.conf"
      - "lists/**"
  schedule:
    # Каждый день в 06:00 UTC (09:00 MSK) — roscomvpn обновляется ночью
    - cron: "0 6 * * *"
  workflow_dispatch:
    # Ручной запуск через кнопку "Run workflow" на GitHub

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run converter
        env:
          # Автоматически передаём owner/repo текущего репозитория
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_BRANCH: ${{ github.ref_name }}
        run: python scripts/generate.py

      - name: Commit and push if changed
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lists/ roscomvpn.conf
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: auto-update generated rules [$(date -u '+%Y-%m-%d')]"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Purge jsDelivr cache
        if: steps.commit.outputs.changed == 'true' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          sleep 10

          purge() {
            local path="$1"
            local url="https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@${GITHUB_REF_NAME}/${path}"
            echo "Purging ${path}"
            curl --fail --silent --show-error --retry 3 --retry-delay 5 "$url" >/dev/null
          }

          purge "roscomvpn.conf"

          grep '^RULE-SET,' roscomvpn.conf \
            | cut -d',' -f2 \
            | sed 's#.*/lists/#lists/#' \
            | sort -u \
            | while read -r path; do
                purge "$path"
              done
