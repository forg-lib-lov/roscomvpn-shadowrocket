name: Update Shadowrocket Config

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update.yml"
      - "scripts/generate.py"
      - "roscomvpn.conf"
      - "lists/**"
  schedule:
    # Каждый день в 06:00 UTC (09:00 MSK) — roscomvpn обновляется ночью
    - cron: "0 6 * * *"
  workflow_dispatch:
    # Ручной запуск через кнопку "Run workflow" на GitHub

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run converter
        env:
          # Автоматически передаём owner/repo текущего репозитория
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_BRANCH: ${{ github.ref_name }}
        run: python scripts/generate.py

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lists/ roscomvpn.conf
          if git diff --staged --quiet; then
            echo "No generated changes"
          else
            git commit -m "chore: auto-update generated rules [$(date -u '+%Y-%m-%d')]"
            git push
          fi
