name: Update Shadowrocket Config

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update.yml"
      - "scripts/generate.py"
      - "roscomvpn.conf"
      - "lists/**"
  schedule:
    # Каждый день в 06:00 UTC (09:00 MSK) — roscomvpn обновляется ночью
    - cron: "0 6 * * *"
  workflow_dispatch:
    # Ручной запуск через кнопку "Run workflow" на GitHub

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run converter
        env:
          # Автоматически передаём owner/repo текущего репозитория
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_BRANCH: ${{ github.ref_name }}
        run: python scripts/generate.py

      - name: Commit and push if changed
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lists/ roscomvpn.conf
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: auto-update generated rules [$(date -u '+%Y-%m-%d')]"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Purge and verify jsDelivr cache
        if: steps.commit.outputs.changed == 'true' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail

          # GitHub branch refs and jsDelivr edge caches are not always updated instantly
          # after git push. A short delay can make jsDelivr re-cache stale branch content.
          sleep 60

          mapfile -t paths < <(
            {
              echo "roscomvpn.conf"
              grep '^RULE-SET,' roscomvpn.conf \
                | cut -d',' -f2 \
                | sed 's#.*/lists/#lists/#'
            } | sort -u
          )

          purge() {
            local path="$1"
            local url="https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@${GITHUB_REF_NAME}/${path}"
            echo "Purging ${path}"
            curl --fail --silent --show-error --retry 3 --retry-delay 5 "$url" >/dev/null
          }

          verify() {
            local path="$1"
            local tmp
            tmp="$(mktemp)"
            local url="https://cdn.jsdelivr.net/gh/${GITHUB_REPOSITORY}@${GITHUB_REF_NAME}/${path}"
            curl --fail --silent --show-error --location --retry 3 --retry-delay 5 "$url" -o "$tmp"
            if cmp -s "$path" "$tmp"; then
              rm -f "$tmp"
              echo "Verified ${path}"
              return 0
            fi
            rm -f "$tmp"
            echo "::warning::CDN is still stale for ${path}"
            return 1
          }

          for attempt in 1 2 3; do
            echo "jsDelivr purge attempt ${attempt}"
            for path in "${paths[@]}"; do
                purge "$path"
            done

            sleep 15

            failed=0
            for path in "${paths[@]}"; do
              if ! verify "$path"; then
                failed=1
              fi
            done

            if [ "$failed" -eq 0 ]; then
              exit 0
            fi

            sleep 45
          done

          echo "::error::jsDelivr cache did not update after retries"
          exit 1
